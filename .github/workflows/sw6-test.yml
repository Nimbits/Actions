name: 'Shopware 6 Plugin Test'

on:
  workflow_call:
    inputs:
      repo_name:
        required: false
        type: 'string'
        description: 'Repository name for zip file (defaults to repository name if not provided)'
      phpstan-level:
        description: 'PHPStan analysis level'
        required: false
        default: '5'
        type: string
      php-version:
        description: 'PHP version for PHPStan'
        required: false
        default: "8.3"
        type: string
      composer-version:
        description: 'PHP version for PHPStan'
        required: false
        default: "2.8.9"
        type: string
      cli-branch:
        description: 'CLI branch to use for configs'
        required: false
        default: 'master'
        type: string
    secrets:
      CURR_VAULT_PATH:
        required: true
      CURR_VAULT_TOKEN:
        required: true
      DEPENDENCY_TOKEN:
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: write

jobs:
  attach-shopware-release:
    runs-on: ubuntu-latest
    needs: test
    if: always()  # Run even if tests fail
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Get plugin info
        id: plugin_info
        run: |
          # Use repo name input if provided, otherwise use repository name
          if [ -n "${{ inputs.repo_name }}" ]; then
            REPO_NAME="${{ inputs.repo_name }}"
          else
            REPO_NAME="${{ github.event.repository.name }}"
          fi

          VERSION=$(jq -r '.version' composer.json)
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Prepare and Zip
        run: |
          mkdir -p "${{ env.REPO_NAME }}"

          mv composer.json "${{ env.REPO_NAME }}/"
          mv src "${{ env.REPO_NAME }}/"

          # Delete js folder and files to prevent leaking JavaScript code
          #rm -rf "${{ env.REPO_NAME }}/src/Resources/app/storefront/src/js"
          #rm -f "${{ env.REPO_NAME }}/src/Resources/app/storefront/src/main.js"

          # Delete Administration (Erlebniswelten) files
          #rm -rf "${{ env.REPO_NAME }}/src/Resources/app/administration/src"

          # Find and delete all other files and directories at the root, except for the plugin directory
          find . -mindepth 1 ! -regex "^./${{ env.REPO_NAME }}\(/.*\)?$" -delete
          zip -r "/tmp/${{ env.REPO_NAME }}-${{ env.VERSION }}.zip" "${{ env.REPO_NAME }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-${{ env.VERSION }}
          path: "/tmp/${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          compression-level: 0
          retention-days: 30

      - name: Create draft release for PR
        if: github.event_name == 'pull_request'
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          name: "PR #${{ github.event.pull_request.number }} - Build ${{ github.run_number }}"
          draft: true
          prerelease: true
          files: "/tmp/${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          body: |
            Automated build for PR #${{ github.event.pull_request.number }}

            **Branch:** ${{ github.head_ref }}
            **Commit:** ${{ github.sha }}
            **Tests:** ${{ needs.test.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repoName = process.env.REPO_NAME;
            const version = process.env.VERSION;
            const repo = context.repo;
            const testsPassed = '${{ needs.test.result }}' === 'success';
            const releaseUrl = '${{ steps.create_release.outputs.url }}';

            const statusEmoji = testsPassed ? '✅' : '⚠️';
            const statusText = testsPassed ? 'Tests Passed' : 'Tests Failed';

            const commentBody = `## ${statusEmoji} Plugin Package Ready (${statusText})

            **Plugin:** \`${repoName}\`
            **Version:** \`${version}\`
            **Package:** \`${repoName}-${version}.zip\`
            **Tests:** ${testsPassed ? '✅ Passed' : '❌ Failed'}

            📦 [Download Plugin Package](${releaseUrl})

            *The zip file is attached to the draft release. Click the link above to download.*
            ${testsPassed ? '' : '\n⚠️ **Warning:** This package was built despite test failures. Use with caution.'}`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: repo.owner,
              repo: repo.repo,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Plugin Package Ready')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: repo.owner,
                repo: repo.repo,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: repo.owner,
                repo: repo.repo,
                body: commentBody
              });
            }
      - name: Delete old PR draft releases
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Find and delete old draft releases for this PR
            for (const release of releases) {
              if (release.draft &&
                  release.tag_name.startsWith(`pr-${prNumber}-`) &&
                  release.id !== parseInt('${{ steps.create_release.outputs.id }}')) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });

                // Also delete the tag
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`,
                  });
                } catch (error) {
                  console.log(`Could not delete tag ${release.tag_name}`);
                }
              }
            }
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Download linting configs from CLI repo
        run: |
          echo "📥 Downloading linting configurations..."
          mkdir -p .github/lint-configs

          # Download package.json from CLI repo
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .github/lint-configs/package.json \
               "https://api.github.com/repos/Nimbits/cli/contents/package.json?ref=${{ inputs.cli-branch }}"

          # Download pnpm-lock.yaml from CLI repo
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .github/lint-configs/pnpm-lock.yaml \
               "https://api.github.com/repos/Nimbits/cli/contents/pnpm-lock.yaml?ref=${{ inputs.cli-branch }}"

          # Download PHPStan config
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .github/lint-configs/phpstan.neon \
               "https://api.github.com/repos/Nimbits/cli/contents/configs/phpstan.neon?ref=${{ inputs.cli-branch }}"

          # Download ESLint config
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .github/lint-configs/eslint.config.js \
               "https://api.github.com/repos/Nimbits/cli/contents/configs/eslint.config.js?ref=${{ inputs.cli-branch }}"

          # Download Stylelint config
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .github/lint-configs/.stylelintrc.json \
               "https://api.github.com/repos/Nimbits/cli/contents/configs/.stylelintrc.json?ref=${{ inputs.cli-branch }}"

          # Download Stylelint ignore file
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .github/lint-configs/.stylelintignore \
               "https://api.github.com/repos/Nimbits/cli/contents/configs/.stylelintignore?ref=${{ inputs.cli-branch }}"

          echo "✅ Downloaded configurations:"
          ls -la .github/lint-configs/

      - name: Determine Base Branch
        id: basebranch
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "branch=$(git ls-remote --heads origin master | grep -q master && echo master || echo main)" >> $GITHUB_ENV
          else
            echo "branch=$(git ls-remote --heads origin master | grep -q master && echo master || (git ls-remote --heads origin main | grep -q main && echo main))" >> $GITHUB_ENV
          fi

      - name: Check composer version
        if: github.event_name != 'release'
        continue-on-error: true
        id: composer-check
        run: |
          git fetch origin ${{ env.branch }}:${{ env.branch }}
          BASE_VERSION=$(jq -r '.version' composer.json -c)
          git checkout ${{ env.branch }}
          CURRENT_VERSION=$(jq -r '.version' composer.json -c)
          git checkout -
          if [ "$GITHUB_REF_NAME" != "${{ env.branch }}" ] && [ "$BASE_VERSION" == "$CURRENT_VERSION" ]; then
            echo "❌ Please change the composer version"
            echo "COMPOSER_CHECK_FAILED=true" >> $GITHUB_ENV
            exit 1
          else
            echo "✅ Composer version check passed"
            echo "COMPOSER_CHECK_FAILED=false" >> $GITHUB_ENV
          fi

      - name: Check for README changes
        if: github.event_name != 'release'
        continue-on-error: true
        id: readme-check
        run: |
          git fetch origin ${{ env.branch }}
          if ! git diff --name-only HEAD origin/${{ env.branch }} | grep -q "README"; then
            echo "❌ Please add the version to the readme"
            echo "README_CHECK_FAILED=true" >> $GITHUB_ENV
            exit 1
          else
            echo "✅ README check passed"
            echo "README_CHECK_FAILED=false" >> $GITHUB_ENV
          fi

      - name: Configure GitHub token
        run: composer config --global --auth github-oauth.github.com ${{ secrets.DEPENDENCY_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          github-token: ${{ secrets.DEPENDENCY_TOKEN }}
          php-version: ${{ inputs.php-version }}
          tools: composer:${{ inputs.composer-version }}

      - name: Install PHP dependencies
        run: composer install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Node.js linting dependencies from CLI
        run: |
          echo "📦 Installing Node.js dependencies from CLI package.json..."
          cd .github/lint-configs

          # Show what files we have
          echo "Downloaded files:"
          ls -la

          # Show package.json content for verification
          echo "CLI package.json content:"
          cat package.json

          # Check if pnpm-lock.yaml was downloaded
          if [ -f "pnpm-lock.yaml" ]; then
            echo "✅ pnpm-lock.yaml found, using frozen lockfile"
            pnpm install --frozen-lockfile
          else
            echo "⚠️ pnpm-lock.yaml not found, installing without frozen lockfile"
            pnpm install --no-frozen-lockfile
          fi

          echo "✅ Installed linting dependencies:"
          ls -la node_modules/.bin/ | grep -E "(eslint|stylelint)" || echo "No linting tools found in bin"

          cd ../..

      - name: PHPStan
        continue-on-error: true
        id: phpstan
        uses: php-actions/phpstan@v3
        with:
          configuration: .github/lint-configs/phpstan.neon
          version: composer
          path: src/
          level: ${{ inputs.phpstan-level }}
          php_version: ${{ inputs.php-version }}

      - name: Set PHPStan result
        run: |
          if [ "${{ steps.phpstan.outcome }}" = "failure" ]; then
            echo "PHPSTAN_FAILED=true" >> $GITHUB_ENV
          else
            echo "PHPSTAN_FAILED=false" >> $GITHUB_ENV
          fi

      - name: Run ESLint (non-blocking)
        id: eslint
        run: |
          echo "🔍 Running ESLint analysis..."
          ESLINT_FAILED=false
          # Check if JS/Vue files exist in plugin source
          if find src -name "*.js" -o -name "*.vue" 2>/dev/null | grep -v node_modules | grep -v vendor | grep -v dist | head -1 | read; then
            echo "Found JS/Vue files in src/, running ESLint..."
            set +e
            npx --prefix .github/lint-configs eslint \
              --config=.github/lint-configs/eslint.config.js \
              --no-error-on-unmatched-pattern \
              src/
            ESLINT_EXIT=$?
            set -e
            if [ $ESLINT_EXIT -ne 0 ]; then
              echo "⚠️ ESLint found issues (exit code $ESLINT_EXIT) - non-blocking"
              ESLINT_FAILED=true
            fi
          else
            echo "No JS/Vue files found to lint"
          fi
          echo "ESLINT_FAILED=$ESLINT_FAILED" >> $GITHUB_ENV
          exit 0

      - name: Run Stylelint (non-blocking)
        id: stylelint
        run: |
          echo "🔍 Running Stylelint analysis..."
          STYLELINT_FAILED=false
          # Check if CSS/SCSS files exist in plugin source
          if find src -name "*.css" -o -name "*.scss" -o -name "*.sass" 2>/dev/null | grep -v node_modules | grep -v vendor | grep -v dist | head -1 | read; then
            echo "Found CSS/SCSS files in src/, running Stylelint..."
            set +e
            npx --prefix .github/lint-configs stylelint \
              --config=.github/lint-configs/.stylelintrc.json \
              --ignore-path=.github/lint-configs/.stylelintignore \
              --allow-empty-input \
              "src/**/*.{css,scss,sass}"
            STYLELINT_EXIT=$?
            set -e
            if [ $STYLELINT_EXIT -ne 0 ]; then
              echo "⚠️ Stylelint found issues (exit code $STYLELINT_EXIT) - non-blocking"
              STYLELINT_FAILED=true
            fi
          else
            echo "No CSS/SCSS files found to lint"
          fi
          echo "STYLELINT_FAILED=$STYLELINT_FAILED" >> $GITHUB_ENV
          exit 0

      - name: Test Results Summary
        run: |
          echo "## 📋 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          BLOCKING_FAILED=""
          WARNING_TESTS=""

          # Composer/README block only when merging into the base branch (master/main),
          # i.e. on pull requests targeting it
          IS_MASTER_MERGE="false"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "${{ env.branch }}" ]; then
            IS_MASTER_MERGE="true"
          fi
          echo "ℹ️ Target branch: ${{ github.base_ref || github.ref_name }} (composer/readme blocking: $IS_MASTER_MERGE)"

          # --- Composer / README (blocking only for merges into master) ---
          if [ "${{ env.COMPOSER_CHECK_FAILED }}" = "true" ]; then
            if [ "$IS_MASTER_MERGE" = "true" ]; then
              echo "❌ **Composer Version Check**: Failed - Please update composer version" >> $GITHUB_STEP_SUMMARY
              BLOCKING_FAILED="$BLOCKING_FAILED composer"
            else
              echo "⚠️ **Composer Version Check**: Warning - Please update composer version (blocks only on merge into ${{ env.branch }})" >> $GITHUB_STEP_SUMMARY
              WARNING_TESTS="$WARNING_TESTS composer"
            fi
          else
            echo "✅ **Composer Version Check**: Passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ env.README_CHECK_FAILED }}" = "true" ]; then
            if [ "$IS_MASTER_MERGE" = "true" ]; then
              echo "❌ **README Check**: Failed - Please update README with version info" >> $GITHUB_STEP_SUMMARY
              BLOCKING_FAILED="$BLOCKING_FAILED readme"
            else
              echo "⚠️ **README Check**: Warning - Please update README with version info (blocks only on merge into ${{ env.branch }})" >> $GITHUB_STEP_SUMMARY
              WARNING_TESTS="$WARNING_TESTS readme"
            fi
          else
            echo "✅ **README Check**: Passed" >> $GITHUB_STEP_SUMMARY
          fi

          # --- PHPStan (always blocking) ---
          if [ "${{ env.PHPSTAN_FAILED }}" = "true" ]; then
            echo "❌ **PHPStan**: Failed - PHP static analysis errors found" >> $GITHUB_STEP_SUMMARY
            BLOCKING_FAILED="$BLOCKING_FAILED phpstan"
          else
            echo "✅ **PHPStan**: Passed" >> $GITHUB_STEP_SUMMARY
          fi

          # --- Non-blocking checks (warnings only) ---
          if [ "${{ env.ESLINT_FAILED }}" = "true" ]; then
            echo "⚠️ **ESLint**: Warnings - JavaScript/Vue linting errors found (non-blocking)" >> $GITHUB_STEP_SUMMARY
            WARNING_TESTS="$WARNING_TESTS eslint"
          else
            echo "✅ **ESLint**: Passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ env.STYLELINT_FAILED }}" = "true" ]; then
            echo "⚠️ **Stylelint**: Warnings - CSS/SCSS linting errors found (non-blocking)" >> $GITHUB_STEP_SUMMARY
            WARNING_TESTS="$WARNING_TESTS stylelint"
          else
            echo "✅ **Stylelint**: Passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Final result — only blocking checks fail the pipeline
          if [ -n "$BLOCKING_FAILED" ]; then
            echo "🔴 **Overall Result**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Failed checks:**$BLOCKING_FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Please fix the above issues and try again." >> $GITHUB_STEP_SUMMARY
            echo "OVERALL_FAILED=true" >> $GITHUB_ENV
          else
            echo "🟢 **Overall Result**: PASSED" >> $GITHUB_STEP_SUMMARY
            if [ -n "$WARNING_TESTS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Non-blocking warnings:**$WARNING_TESTS" >> $GITHUB_STEP_SUMMARY
            fi
            echo "OVERALL_FAILED=false" >> $GITHUB_ENV
          fi

      - name: Fail job if blocking checks failed
        if: env.OVERALL_FAILED == 'true'
        run: |
          echo "❌ One or more blocking checks failed (PHPStan always blocks; Composer/README block on merges into master). Check the summary above for details."
          exit 1